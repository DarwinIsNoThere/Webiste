<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="icon" type="image/png" href="assets/Niko.png">
    <style>
        /* Gloria variables*/
        :root {
            --bg: #050505;
            --fg: #ffffff;
            --muted: #a1a1aa;
            --line: #27272a;
            --youtube: #FF0000;
            --twitch: #9146FF;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --bezier: cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Reseteo */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scrollbar-width: none; overflow-x: hidden; }
        html::-webkit-scrollbar { display: none; } /* Mi miedo, no tener barra */

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 4rem 1rem;
            overflow-x: hidden;
        }

        .container { 
            width: 100%; 
            max-width: 680px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 3rem; 
        }

        /* Animaciones pedorras */
        @keyframes reveal {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Niko esta flotando porque ignoró las leyes de Newton */
        @keyframes nikoFloat {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        .reveal {
            animation: reveal 0.8s var(--bezier) forwards;
            opacity: 0;
            width: 100%;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        .header { 
            text-align: center; 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* es como el 3rd fixeo a esto porfa FUNCIONA */
        .header-main {
            display: flex;
            flex-direction: row; 
            align-items: center; 
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            width: 100%;
        }

        /* Si Niko deja de flotar, es que el mundo se acabo */
        .niko-img { 
            width: 60px; /* Tamaño ajustable para que quepan bien */
            height: 60px; 
            object-fit: contain; 
            animation: nikoFloat 4s ease-in-out infinite;
            flex-shrink: 0;
        }

        .header h1 { 
            font-size: 2.2rem; /* qUE PUTAS SON REM */
            font-weight: 900; 
            letter-spacing: -0.04em; 
            line-height: 1; 
        }

        /* Ajustes de pc */
        @media (min-width: 600px) {
            .header h1 { font-size: 3.5rem; }
            .niko-img { width: 80px; height: 80px; }
            .header-main { gap: 20px; }
        }

        .mc-skin {
            width: 125px; height: 125px; border-radius: 50%;
            border: 1px solid var(--line);
            margin-bottom: 1.5rem;
            transition: transform 0.4s var(--bezier);
        }
        /* wtf es esto */
        .mc-skin:hover { transform: scale(1.1) rotate(-5deg); }

        .header p { color: var(--muted); margin-bottom: 1.5rem; font-size: 1.2rem; }

        /* los links al sexo */
        .socials { display: flex; justify-content: center; gap: 12px; margin-bottom: 1.5rem; width: 100%; flex-wrap: wrap; }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1.5px solid;
            transition: all 0.3s var(--bezier);
        }

        .youtube-link { color: var(--youtube); border-color: var(--youtube); }
        .youtube-link:hover { background: var(--youtube); color: white; transform: translateY(-3px); box-shadow: 0 10px 20px -10px var(--youtube); }

        .twitch-link { color: var(--twitch); border-color: var(--twitch); }
        .twitch-link:hover { background: var(--twitch); color: white; transform: translateY(-3px); box-shadow: 0 10px 20px -10px var(--twitch); }

        .contact-mail { 
            color: var(--muted); text-decoration: none; font-size: 0.85rem; 
            display: inline-block; transition: color 0.3s;
            text-align: center;
        }
        .contact-mail:hover { color: var(--fg); }
        .contact-mail span { color: #d8b4fe; text-decoration: underline; }

        .section-title {
            font-size: 0.85rem; font-weight: 700; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 1.2rem;
            text-align: center;
        }

        .links-list { display: flex; flex-direction: column; gap: 1rem; width: 100%; }

        .link-card {
            display: flex; align-items: center; justify-content: center;
            padding: 1.4rem; border: 1px solid var(--line); border-radius: 14px;
            text-decoration: none; color: var(--fg); font-weight: 600;
            transition: all 0.3s var(--bezier);
            background: rgba(255,255,255,0.01);
        }

        .link-card:hover { 
            background: #111; 
            border-color: #3f3f46; 
            transform: translateX(12px); 
        }

        .empty-state {
            padding: 2.5rem; text-align: center;
            border: 1px dashed var(--line); border-radius: 14px;
            color: var(--muted); font-style: italic;
            width: 100%;
        }

        footer {
            margin-top: 3rem; text-align: center; color: #444;
            font-size: 0.9rem; padding-bottom: 2rem;
        }
    </style>
</head>
<body>

    <audio id="snd-hover" src="assets/boton.ogg" preload="auto"></audio>
    <audio id="snd-click" src="assets/pop.ogg" preload="auto"></audio>

    <main class="container">
        
        <header class="header reveal delay-1">
            <img src="https://render.crafty.gg/3d/bust/769133f8-30ec-407b-af99-910641c05855" alt="Skin" class="mc-skin">
            
            <div class="header-main">
                <img src="assets/Niko.png" alt="Niko" class="niko-img">
                <h1>DarwinIsNoThere</h1>
            </div>

            <p>Estudiante.</p>

            <nav class="socials">
                <a href="https://www.youtube.com/@DarwinIsNoThere" class="social-link youtube-link sfx-btn" target="_blank">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                    YouTube
                </a>

                <a href="https://www.twitch.tv/DarwinIsNoThere" class="social-link twitch-link sfx-btn" target="_blank">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
                    Twitch
                </a>
            </nav>

            <a href="mailto:darwinelgd.idk@gmail.com" target="_blank" class="contact-mail sfx-btn">
                Mándame una carta de amor (o mamadas) — <span>darwinelgd.idk@gmail.com</span>
            </a>
        </header>

        <section class="reveal delay-2">
            <h2 class="section-title">Escuela</h2>
            <div class="links-list">
                <a href="https://quizz.darwinisnothere.lat/" target="_blank" class="link-card sfx-btn">PROYECTO ARTES</a>
                <a href="https://xd.darwinisnothere.lat/" target="_blank" class="link-card sfx-btn">PROYECTO ARTES MEMORAMA</a>
            </div>
        </section>

        <section class="reveal delay-3">
            <h2 class="section-title">PERSONAL</h2>
            <div class="empty-state">
                Aquí no hay nada. Como en mi cuenta bancaria.
            </div>
        </section>

        <footer class="reveal delay-3">
            © 2026 · Links · DarwinsNoThere
        </footer>

    </main>

    <script>
        /* Esto funciona a base de fe */
        const hSnd = document.getElementById('snd-hover');
        const cSnd = document.getElementById('snd-click');
        const btns = document.querySelectorAll('.sfx-btn');

        btns.forEach(b => {
            b.addEventListener('mouseenter', () => {
                hSnd.currentTime = 0;
                hSnd.play().catch(() => {});
            });
            b.addEventListener('mousedown', () => {
                cSnd.currentTime = 0;
                cSnd.play().catch(() => {});
            });
        });
    </script>
</body>
</html>
