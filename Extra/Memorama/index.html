<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>☁️ Memorama</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.95);
            --fg: #ffffff;
            --line: #333333;
            --muted: #888888;
            --accent: #9146FF;
            --correct: #4CAF50;
            --incorrect: #FF5252;
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            touch-action: manipulation; /* Mejora táctil */
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Fijo para evitar scroll */
            overflow: hidden; /* Bloquea scroll */
            position: fixed; /* Bloquea rebote en iOS */
            width: 100%;
        }

        /* --- FONDO MEJORADO --- */
        body::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background-image: radial-gradient(circle, #ffffff 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.08;
            animation: floatBackground 20s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes floatBackground {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(-30px) scale(1.05) rotate(2deg); }
        }

        /* --- MENÚ DE OPCIONES --- */
        .options-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .dots-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--line);
            color: var(--fg);
            width: 45px; height: 45px;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px);
        }

        .dots-btn:hover { 
            background: var(--fg); color: var(--bg);
            transform: scale(1.1) rotate(90deg);
        }

        .dropdown {
            position: absolute; top: 55px; right: 0;
            background: rgba(25, 25, 25, 0.95);
            border: 1px solid var(--line);
            border-radius: 16px;
            min-width: 200px;
            display: none; flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            animation: dropdownFade 0.3s ease forwards;
        }

        .dropdown.show { display: flex; }

        .dropdown button {
            background: none; border: none; color: white;
            padding: 16px; text-align: left; cursor: pointer;
            font-size: 13px; font-weight: 800; letter-spacing: 1px;
            transition: all 0.2s; display: flex; align-items: center; gap: 10px;
        }

        .dropdown button:hover { background: var(--accent); }
        .dropdown button:not(:last-child) { border-bottom: 1px solid var(--line); }

        @keyframes dropdownFade {
            from { opacity: 0; transform: translateY(-15px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-container {
            background: var(--card-bg);
            padding: 25px; /* Ajustado para móvil */
            border-radius: 40px;
            border: 1px solid var(--line);
            width: 95%; max-width: 500px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            position: relative;
        }

        h1 { font-size: 1.4rem; letter-spacing: 4px; margin-bottom: 8px; font-weight: 800; }
        .stats { color: var(--muted); font-size: 0.75rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }

        /* --- PANTALLA FINAL --- */
        #end-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.98); border-radius: 40px;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; animation: dropdownFade 0.4s ease forwards;
        }
        #end-screen h2 { letter-spacing: 5px; margin-bottom: 20px; }
        .final-stats { display: flex; gap: 30px; margin-bottom: 30px; }
        .stat-box span { display: block; font-size: 0.7rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 5px; }
        .stat-box b { font-size: 1.4rem; }
        .retry-btn {
            background: var(--fg); color: var(--bg); border: none;
            padding: 12px 30px; border-radius: 50px; font-weight: 800;
            cursor: pointer; letter-spacing: 1px; transition: 0.3s;
        }
        .retry-btn:hover { transform: scale(1.1); background: var(--accent); color: white; }

        /* --- GRID --- */
        .game-board {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            width: 100%;
        }

        .card {
            aspect-ratio: 1/1; cursor: pointer; perspective: 1000px;
            opacity: 0; -webkit-tap-highlight-color: transparent;
        }

        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s;
            transform-style: preserve-3d; border-radius: 14px;
            border: 2px solid var(--line);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card:hover .card-inner { border-color: var(--fg); transform: translateY(-3px); }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card.matched .card-inner {
            border-color: var(--correct);
            animation: pulseSuccess 0.6s ease-out forwards;
        }

        .card.error .card-inner {
            border-color: var(--incorrect);
            animation: shakeDeltarune 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        .card-front { background: #1a1a1a; font-size: 1.8rem; color: #333; }
        .card-back { background: #000; transform: rotateY(180deg); overflow: hidden; }
        .card-back img { width: 100%; height: 100%; object-fit: cover; }

        @keyframes cardDeal {
            0% { opacity: 0; transform: translateY(120%) rotate(var(--start-rot)); }
            60% { transform: translateY(-10px) rotate(0deg); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes shakeDeltarune {
            10%, 90% { transform: rotateY(180deg) translate3d(-2px, 0, 0); }
            20%, 80% { transform: rotateY(180deg) translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: rotateY(180deg) translate3d(-8px, 0, 0); }
            40%, 60% { transform: rotateY(180deg) translate3d(8px, 0, 0); }
        }

        @keyframes pulseSuccess {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.05); box-shadow: 0 0 40px var(--correct); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        footer {
            position: fixed; bottom: 15px;
            font-size: 0.6rem; color: var(--muted);
            letter-spacing: 2px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="options-menu">
        <button class="dots-btn" id="menuToggle">⋮</button>
        <div class="dropdown" id="dropdownMenu">
            <button onclick="initGame()">🔄 REINICIAR PARTIDA</button>
            <button id="musicToggle">🔈 MÚSICA: OFF</button>
        </div>
    </div>

    <main class="main-container">
        <h1>Memorama de Artistas</h1>
        <div class="stats" id="stats">Parejas: 0 / 10</div>
        
        <div class="game-board" id="board"></div>

        <div id="end-screen">
            <h2>LOGRADO</h2>
            <div class="final-stats">
                <div class="stat-box"><span>TIEMPO</span><b id="final-time">00:00</b></div>
                <div class="stat-box"><span>FALLOS</span><b id="final-mistakes">0</b></div>
            </div>
            <button class="retry-btn" onclick="initGame()">NUEVA PARTIDA</button>
        </div>
    </main>

    <footer>© 2026 · Memorama · DarwinsNoThere</footer>

    <audio id="snd-flip" src="sfxs/seleccionar.ogg"></audio>
    <audio id="snd-correct" src="sfxs/correcto.ogg"></audio>
    <audio id="snd-wrong" src="sfxs/incorrecto.ogg"></audio>
    <audio id="snd-win" src="sfxs/win.ogg"></audio>
    <audio id="snd-bg" src="sfxs/musica.mp4" loop></audio>

    <script>
        const imgFolder = "artistas/";
        // CAMBIO 2: Cambiado .PNG a .png (minúsculas). ¡Es vital para GitHub!
        const allArtists = Array.from({length: 52}, (_, i) => `artista_${i + 1}.png`);
        
        let flippedCards = [];
        let matchedPairs = 0;
        let lockBoard = false;
        let isMusicPlaying = false;
        
        // Variables para la pantalla final
        let mistakes = 0;
        let startTime;
        let timerInterval;

        const sounds = {
            flip: document.getElementById('snd-flip'),
            correct: document.getElementById('snd-correct'),
            wrong: document.getElementById('snd-wrong'),
            win: document.getElementById('snd-win'),
            bg: document.getElementById('snd-bg')
        };

        const menuToggle = document.getElementById('menuToggle');
        const dropdown = document.getElementById('dropdownMenu');
        const musicBtn = document.getElementById('musicToggle');

        menuToggle.onclick = (e) => { e.stopPropagation(); dropdown.classList.toggle('show'); };
        document.onclick = () => dropdown.classList.remove('show');

        musicBtn.onclick = () => {
            if (isMusicPlaying) {
                sounds.bg.pause();
                musicBtn.innerHTML = "🔈 MÚSICA: OFF";
            } else {
                sounds.bg.play().catch(() => console.log("Audio interaction needed"));
                musicBtn.innerHTML = "🔊 MÚSICA: ON";
            }
            isMusicPlaying = !isMusicPlaying;
        };

        function initGame() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            document.getElementById('end-screen').style.display = 'none';
            matchedPairs = 0;
            flippedCards = [];
            lockBoard = false;
            mistakes = 0;
            startTime = null;
            clearInterval(timerInterval);

            document.getElementById('stats').innerText = `Parejas: 0 / 10`;
            dropdown.classList.remove('show');

            const selected = [...allArtists].sort(() => 0.5 - Math.random()).slice(0, 10);
            const gameCards = [...selected, ...selected].sort(() => 0.5 - Math.random());

            gameCards.forEach((imgName, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.value = imgName;
                
                const randomRot = Math.floor(Math.random() * 40 - 20) + 'deg';
                card.style.setProperty('--start-rot', randomRot);
                card.style.animation = `cardDeal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards ${index * 0.05}s`;
                
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back"><img src="${imgFolder}${imgName}" loading="lazy"></div>
                    </div>`;
                
                card.onclick = () => flipCard(card);
                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            // Iniciar tiempo en el primer click
            if (!startTime) startTime = Date.now();

            sounds.flip.currentTime = 0;
            sounds.flip.play().catch(()=>{});
            
            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                lockBoard = true;
                checkMatch();
            }
        }

        function checkMatch() {
            const [c1, c2] = flippedCards;
            const match = c1.dataset.value === c2.dataset.value;

            if (match) {
                setTimeout(() => {
                    sounds.correct.currentTime = 0;
                    sounds.correct.play().catch(()=>{});
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    matchedPairs++;
                    document.getElementById('stats').innerText = `Parejas: ${matchedPairs} / 10`;
                    resetTurn();
                    if (matchedPairs === 10) endGame();
                }, 300);
            } else {
                mistakes++;
                setTimeout(() => {
                    c1.classList.add('error');
                    c2.classList.add('error');
                    sounds.wrong.currentTime = 0;
                    sounds.wrong.play().catch(()=>{});
                    
                    setTimeout(() => {
                        c1.classList.remove('flipped', 'error');
                        c2.classList.remove('flipped', 'error');
                        resetTurn();
                    }, 600);
                }, 500);
            }
        }

        function endGame() {
            const endTime = Date.now();
            const totalTime = Math.floor((endTime - startTime) / 1000);
            const minutes = Math.floor(totalTime / 60);
            const seconds = totalTime % 60;
            
            document.getElementById('final-time').innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('final-mistakes').innerText = mistakes;
            
            sounds.win.play();
            setTimeout(() => {
                document.getElementById('end-screen').style.display = 'flex';
            }, 600);
        }

        function resetTurn() {
            flippedCards = [];
            lockBoard = false;
        }

        window.onload = initGame;
    </script>
</body>
</html>
